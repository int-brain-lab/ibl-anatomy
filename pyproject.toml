[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibl-anatomy"
version = "0.1.0"
description = "Portable contracts and immutable assets for IBL reference anatomy"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.18",
    "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.package-data]
ibl_anatomy = ["schemas/*.json", "asset_sets/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
