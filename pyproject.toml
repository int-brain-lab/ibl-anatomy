[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibl-atlas-assets"
version = "0.0.0"
description = "Renderer-neutral IBL atlas asset readers and validators"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.18",
    "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.package-data]
ibl_atlas_assets = ["schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
